name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  github-release:
    name: GitHub release and GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: ./mvnw -B -ntp -DskipTests package
      - name: Deploy to GitHub Packages
        run: ./mvnw -B -ntp -s .mvn/settings.xml -DskipTests -Pgithub-packages deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect artifacts
        run: |
          mkdir -p dist
          for m in durable-agents-*; do cp "$m"/target/"$m"-*.jar dist/ 2>/dev/null || true; done
          cp examples/ticket-triage/target/ticket-triage-*.jar dist/ 2>/dev/null || true
          cp examples/order-refund/target/order-refund-*.jar dist/ 2>/dev/null || true
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - name: Release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { p=1; next }
            p && $0 ~ "^## \\[" { p=0 }
            p { print }' CHANGELOG.md > notes.md
          echo "Artifacts: modules for Maven via GitHub Packages (repository \`https://maven.pkg.github.com/bnymnDev/spring-durable-agents\`, group \`io.github.bnymndev\`) and JitPack (\`com.github.bnymnDev.spring-durable-agents:<module>:$GITHUB_REF_NAME\`)." >> notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "spring-durable-agents ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag

  maven-central:
    name: Maven Central
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: creds
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Central Portal credentials or GPG key not configured; skipping Maven Central." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy to the Central Portal
        if: steps.creds.outputs.configured == 'true'
        run: ./mvnw -B -ntp -Prelease -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
