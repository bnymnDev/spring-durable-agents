name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0); the tag v<version> is created on the selected ref if it does not exist
        required: true

permissions:
  contents: write
  packages: write

jobs:
  github-release:
    name: GitHub release and GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "name=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"; else echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; fi
      - name: Create tag when missing
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag exists"
          else
            git config user.name "${GITHUB_ACTOR}"
            git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
            git tag -a "$tag" -m "spring-durable-agents ${tag#v}"
            git push origin "refs/tags/$tag"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: ./mvnw -B -ntp -DskipTests package
      - name: Deploy to GitHub Packages
        run: ./mvnw -B -ntp -s .mvn/settings.xml -DskipTests -Pgithub-packages deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect artifacts
        run: |
          mkdir -p dist
          for m in durable-agents-*; do cp "$m"/target/"$m"-*.jar dist/ 2>/dev/null || true; done
          cp examples/ticket-triage/target/ticket-triage-*.jar dist/ 2>/dev/null || true
          cp examples/order-refund/target/order-refund-*.jar dist/ 2>/dev/null || true
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - name: Release notes
        id: notes
        run: |
          tag="${{ steps.tag.outputs.name }}"
          version="${tag#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { p=1; next }
            p && $0 ~ "^## \\[" { p=0 }
            p { print }' CHANGELOG.md > notes.md
          echo "Artifacts: modules for Maven via GitHub Packages (repository \`https://maven.pkg.github.com/bnymnDev/spring-durable-agents\`, group \`io.github.bnymndev\`) and JitPack (\`com.github.bnymnDev.spring-durable-agents:<module>:$tag\`)." >> notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "spring-durable-agents ${tag#v}" \
            --notes-file notes.md \
            --verify-tag

  maven-central:
    name: Maven Central
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: creds
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Central Portal credentials or GPG key not configured; skipping Maven Central." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy to the Central Portal
        if: steps.creds.outputs.configured == 'true'
        run: ./mvnw -B -ntp -Prelease -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
