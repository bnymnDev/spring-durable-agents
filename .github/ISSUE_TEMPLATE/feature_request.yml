name: Feature request
description: Propose a new capability or a change to an existing one
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [SPEC.md](https://github.com/bnymnDev/spring-durable-agents/blob/main/SPEC.md) and
        [DECISIONS.md](https://github.com/bnymnDev/spring-durable-agents/blob/main/DECISIONS.md) first:
        some things are out of scope on purpose, and settled decisions are listed there.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What the API, property or behaviour could look like. Code sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including doing nothing.
